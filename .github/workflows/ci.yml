name: CI

on:
  pull_request:
    branches: [homolog, main]
  push:
    branches: [homolog, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: integra_sgi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integra_sgi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integra_sgi?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/integra_sgi?schema=public
      APP_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-characters
      VITE_API_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy --workspace @integra/api
      - run: npm run lint
      - run: npm run build
      - run: npm test --workspaces --if-present
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @integra/web
