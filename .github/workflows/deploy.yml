name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'homolog' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
      PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - name: Check out the validated commit (API)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: api-source
          persist-credentials: false
      - name: Check out the validated commit (web)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: web-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: api-source/package-lock.json
      - name: Validate configuration and reject superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_API_BYPASS_SECRET: ${{ secrets.VERCEL_API_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          for key in VERCEL_ORG_ID VERCEL_TOKEN VERCEL_API_BYPASS_SECRET API_PROJECT_ID WEB_PROJECT_ID API_DOMAIN WEB_DOMAIN PUBLIC_WEB_URL VERCEL_CLI_VERSION; do
            test -n "${!key}" || { echo "Missing configuration: $key"; exit 1; }
          done
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$API_DOMAIN" =~ ^[a-zA-Z0-9.-]+\.vercel\.app$ && "$WEB_DOMAIN" =~ ^[a-zA-Z0-9.-]+\.vercel\.app$ ]]
          [[ "$PUBLIC_WEB_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          test "$API_PROJECT_ID" != "$WEB_PROJECT_ID"
          test "$API_DOMAIN" != "$WEB_DOMAIN"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEPLOY_BRANCH" --jq '.object.sha')
          test "$current" = "$DEPLOY_SHA" || { echo 'Superseded commit: run CI on the branch head.'; exit 1; }
      - name: Install pinned Vercel CLI separately from workspaces
        run: npm install --prefix "$RUNNER_TEMP/vercel-cli" "vercel@$VERCEL_CLI_VERSION"
      - name: Pull settings and build both projects
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel"
          target=preview
          flags=()
          # Vercel only accepts --git-branch with the preview target.
          pull_flags=(--git-branch="$DEPLOY_BRANCH")
          if [[ "$DEPLOY_BRANCH" == main ]]; then target=production; flags+=(--prod); pull_flags=(); fi
          for project in api web; do
            if [[ "$project" == api ]]; then export VERCEL_PROJECT_ID="$API_PROJECT_ID"; else export VERCEL_PROJECT_ID="$WEB_PROJECT_ID"; fi
            cd "$GITHUB_WORKSPACE/$project-source"
            # Preserve branch-scoped Preview runtime variables on detached SHA checkouts.
            git switch --force-create "$DEPLOY_BRANCH" "$DEPLOY_SHA"
            "$cli" pull --yes --environment="$target" "${pull_flags[@]}" --token="$VERCEL_TOKEN"
            if [[ "$project" == web ]]; then
              node "$GITHUB_WORKSPACE/web-source/scripts/configure-vercel-web.mjs" \
                "$GITHUB_WORKSPACE/web-source/frontend/vercel.json" "$API_DOMAIN"
            fi
            "$cli" build "${flags[@]}" --token="$VERCEL_TOKEN"
          done
          node "$GITHUB_WORKSPACE/api-source/scripts/check-vercel-package.mjs" "$GITHUB_WORKSPACE/api-source/.vercel/output"
          test -s "$GITHUB_WORKSPACE/web-source/.vercel/output/static/index.html"
      - name: Recheck branch head before migrating
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_API_BYPASS_SECRET: ${{ secrets.VERCEL_API_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEPLOY_BRANCH" --jq '.object.sha')
          test "$current" = "$DEPLOY_SHA" || { echo 'Branch advanced during build; refusing migration.'; exit 1; }
      - name: Apply approved migrations to this environment
        working-directory: api-source
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          API_BYPASS_SECRET: ${{ secrets.VERCEL_API_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DIRECT_URL" || { echo 'DIRECT_URL is required'; exit 1; }
          node scripts/check-vercel-environment.mjs
          npm run db:migrate:deploy --workspace @integra/api
      - name: Deploy API and web, with health gates
        env:
          API_BYPASS_SECRET: ${{ secrets.VERCEL_API_BYPASS_SECRET }}
          WEB_BYPASS_SECRET: ${{ secrets.VERCEL_WEB_BYPASS_SECRET }}
        run: bash api-source/scripts/deploy-vercel.sh
      - name: Deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '### Vercel deployment\n\nCommit: `%s`\n\nBranch: `%s`\n\nResult: %s\n' "$DEPLOY_SHA" "$DEPLOY_BRANCH" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'If publication failed, check completed steps and deployment URLs before retrying. Migrations are not automatically reverted.' >> "$GITHUB_STEP_SUMMARY"
